services:
  web-api:
    image: ${DOCKER_REGISTRY-}webapi
    container_name: web-api
    build:
      context: .
      dockerfile: src/Web.Api/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081

  postgresService:
    image: postgres:17
    container_name: postgresContainer
    environment:
      - POSTGRES_DB=clean-architecture
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/db:/var/lib/postgresql/data
    ports:
      - 5433:5432

  seq:
    image: datalust/seq:2024.3
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - 8081:80

  redis:
    image: redis:latest
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - redisinsight_data:/db

  rabbitmq.producer:
    image: ${DOCKER_REGISTRY-}rabbitmqproducer
    build:
      context: RabbitMQ.Producer
      dockerfile: Dockerfile
    depends_on:
     - rabbitmq
  
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  rabbitmq.consumer:
    image: ${DOCKER_REGISTRY-}rabbitmqconsumer
    build:
      context: RabbitMq.Consumer
      dockerfile: Dockerfile
    depends_on:
     - rabbitmq

  masstransit.beginner:
    image: ${DOCKER_REGISTRY-}masstransitbeginner
    build:
      context: Masstransit/Masstransit.beginner
      dockerfile: Dockerfile
    ports:
      - 5002:8080
      - 5003:8081
    depends_on:
      - rabbitmq      
    environment:      
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest

volumes:
  redis_data:
  redisinsight_data:



